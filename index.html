<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>La Lueur</title>
<meta name="theme-color" content="#13243C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Lueur">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#24395A;
    --deep:#13243C;
    --gold:#C9A84C;
    --gold-light:#E8D5A3;
    --mist:#8FA3BD;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--deep)}
  body{
    font-family:'Cormorant Garamond',Georgia,serif;
    color:var(--gold-light);
    touch-action:none;
    user-select:none;-webkit-user-select:none;
    overscroll-behavior:none;
  }
  #game{display:block;position:fixed;inset:0;width:100%;height:100%}

  /* vignette au-dessus du canvas */
  #vignette{
    position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 42%, transparent 50%, rgba(8,16,28,.3) 100%);
  }

  /* ---------- HUD ---------- */
  #hud{
    position:fixed;top:max(18px, env(safe-area-inset-top));left:0;right:0;
    text-align:center;z-index:3;pointer-events:none;
    opacity:0;transition:opacity .5s ease;
  }
  #hud.visible{opacity:1}
  #score{
    font-size:46px;font-weight:500;letter-spacing:.08em;
    color:var(--gold-light);
    text-shadow:0 0 22px rgba(201,168,76,.35);
    line-height:1;
    transition:color .4s ease, text-shadow .4s ease;
  }
  #score.record{color:var(--gold);text-shadow:0 0 32px rgba(201,168,76,.75)}
  #combo{
    margin-top:4px;font-size:17px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold);opacity:0;transition:opacity .25s ease;
  }
  #combo.on{opacity:.95}

  /* ---------- Bouton son ---------- */
  #mute{
    position:fixed;top:max(14px, env(safe-area-inset-top));right:14px;z-index:6;
    width:42px;height:42px;border-radius:50%;
    background:rgba(26,45,69,.55);border:1px solid rgba(201,168,76,.35);
    color:var(--gold);font-size:17px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,serif;
    transition:border-color .2s;
  }
  #mute:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- Bouton Nova ---------- */
  #burst{
    position:fixed;top:max(14px, env(safe-area-inset-top));left:14px;
    width:46px;height:46px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    z-index:4;font-size:21px;line-height:1;
    color:#13243C;background:var(--gold);
    border:none;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
    box-shadow:0 0 16px rgba(201,168,76,.5);
  }
  #burst.ready{opacity:1;pointer-events:auto;animation:novaPulse 1.1s ease-in-out infinite}
  @keyframes novaPulse{
    0%,100%{transform:scale(1);box-shadow:0 0 12px rgba(201,168,76,.4)}
    50%{transform:scale(1.08);box-shadow:0 0 26px rgba(201,168,76,.8)}
  }
  @media (prefers-reduced-motion:reduce){#burst.ready{animation:none}}

  /* ---------- Écrans (menu / fin) ---------- */
  .screen{
    position:fixed;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    background:rgba(10,20,34,.42);
    backdrop-filter:blur(2px);
    opacity:1;transition:opacity .45s ease;
  }
  .screen.hidden{opacity:0;pointer-events:none}

  .curve{width:200px;height:34px;margin-bottom:6px;opacity:.9}

  h1{
    font-size:60px;font-weight:500;letter-spacing:.34em;text-indent:.34em;
    color:var(--gold-light);
    text-shadow:0 0 32px rgba(201,168,76,.45);
  }
  .rule{
    width:120px;height:1px;margin:18px auto 20px;
    background:linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent);
  }
  .tagline{
    font-size:21px;font-style:italic;font-weight:400;
    color:var(--mist);max-width:300px;line-height:1.45;
  }
  .ctrl{
    margin-top:18px;font-size:15.5px;letter-spacing:.05em;line-height:1.5;
    color:rgba(232,213,163,.6);
  }
  .modes{display:flex;flex-direction:column;gap:14px;margin-top:28px;width:min(280px,80vw)}
  .modeBtn{
    font-family:'Cormorant Garamond',Georgia,serif;
    padding:13px 10px;background:rgba(26,45,69,.45);
    border:1px solid var(--gold);border-radius:2px;cursor:pointer;
    color:var(--gold-light);font-size:21px;letter-spacing:.24em;text-transform:uppercase;text-indent:.24em;
    transition:background .25s, box-shadow .25s;
  }
  .modeBtn span{display:block;font-size:14.5px;letter-spacing:.03em;text-transform:none;text-indent:0;font-style:italic;color:var(--mist);margin-top:5px}
  .modeBtn em{display:block;font-style:normal;font-size:13px;letter-spacing:.14em;color:rgba(232,213,163,.55);margin-top:5px;text-transform:none;text-indent:0}
  .modeBtn:hover,.modeBtn:focus-visible{background:rgba(201,168,76,.12);box-shadow:0 0 22px rgba(201,168,76,.25);outline:none}
  #toMenu{
    margin-top:14px;padding:10px 32px;background:transparent;cursor:pointer;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:15px;letter-spacing:.24em;text-transform:uppercase;text-indent:.24em;
    color:var(--mist);border:1px solid rgba(143,163,189,.4);border-radius:2px;
  }
  #toMenu:hover,#toMenu:focus-visible{border-color:var(--mist);outline:none}
  .hint{
    margin-top:42px;font-size:15px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--gold);animation:breathe 2.6s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  .best{
    margin-top:14px;font-size:16px;letter-spacing:.18em;
    color:rgba(232,213,163,.55);
  }

  /* fin de partie */
  #over h2,#pause h2{
    font-size:27px;font-weight:400;font-style:italic;letter-spacing:.04em;
    color:var(--mist);
  }
  #finalScore{
    font-size:84px;font-weight:500;line-height:1.05;margin-top:10px;
    color:var(--gold-light);text-shadow:0 0 36px rgba(201,168,76,.4);
  }
  #newBest{
    margin-top:6px;font-size:15px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold);display:none;
  }
  #newBest.show{display:block;animation:breathe 2s ease-in-out infinite}
  #overBest{margin-top:14px;font-size:17px;letter-spacing:.16em;color:rgba(232,213,163,.6)}

  #replay{
    margin-top:40px;padding:15px 52px;
    font-family:'Cormorant Garamond',Georgia,serif;
    font-size:19px;letter-spacing:.3em;text-transform:uppercase;text-indent:.3em;
    color:var(--gold-light);background:transparent;cursor:pointer;
    border:1px solid var(--gold);border-radius:2px;
    transition:background .25s, box-shadow .25s;
  }
  #replay:hover,#replay:focus-visible{
    background:rgba(201,168,76,.12);
    box-shadow:0 0 26px rgba(201,168,76,.25);
    outline:none;
  }

  @media (max-height:600px){
    h1{font-size:44px}
    #finalScore{font-size:62px}
    .hint{margin-top:26px}
  }
  @media (prefers-reduced-motion:reduce){
    .hint,#newBest.show{animation:none;opacity:1}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="vignette"></div>

<div id="hud" aria-live="off">
  <div id="score">0</div>
  <div id="combo"></div>
</div>

<button id="mute" aria-label="Couper le son">♪</button>
<button id="burst" aria-label="Faire exploser la nova">✦</button>

<!-- Écran titre -->
<div id="menu" class="screen">
  <svg class="curve" viewBox="0 0 200 34" fill="none" aria-hidden="true">
    <path d="M12 26 C 60 4, 138 2, 192 18" stroke="#C9A84C" stroke-width="1.4" stroke-linecap="round"/>
  </svg>
  <h1>LA LUEUR</h1>
  <div class="rule"></div>
  <p class="tagline">Survis dans la nuit.<br>Frôle l'obscurité pour briller.</p>
  <div class="modes">
    <button class="modeBtn" id="playSurvie">Survie<span>Esquive l'obscurité — frôler rapporte gros</span><em id="bestSurvie"></em></button>
    <button class="modeBtn" id="playArcade">Arcade<span>Brise les rochers — évite les braises</span><em id="bestArcade"></em></button>
  </div>
  <p class="ctrl">Appuie deux fois sur l'écran pour la nova ✦</p>
</div>

<!-- Écran de fin -->
<div id="over" class="screen hidden">
  <h2>La lueur s'est éteinte…</h2>
  <div id="finalScore">0</div>
  <div id="newBest">✦ Nouveau record ✦</div>
  <div id="overBest"></div>
  <button id="replay">Rejouer</button>
  <button id="toMenu">Menu</button>
</div>

<!-- Écran de pause -->
<div id="pause" class="screen hidden">
  <h2>En pause</h2>
  <div class="hint">Touche l'écran pour reprendre</div>
</div>

<script>
'use strict';

/* ============================================================
   LA LUEUR — jeu d'esquive et de frôlement
   Une orbe dorée, la nuit, des éclats d'obscurité.
   Palette : navy #1A2D45 · or #C9A84C
   ============================================================ */

// ---------- Constantes ----------
const GOLD       = '#C9A84C';
const GOLD_LIGHT = '#E8D5A3';
const GRAZE_BONUS   = 15;     // points de base par frôlement (× combo)
const PASS_POINTS   = 3;      // points par rocher esquivé (× taille de l'orbe)
const COMBO_WINDOW  = 3.5;    // secondes pour enchaîner les frôlements
const GRAZE_MARGIN  = 30;     // distance de frôlement (px)
const SIZE_PER_GRAZE = 0.08;  // croissance de l'orbe par frôlement
const SIZE_CRITICAL  = 2.4;   // seuil de surcharge : éclairs + instabilité
const SIZE_MAX       = 3.0;   // taille maximale absolue (×)
const MIN_BURST      = 1.18;  // taille minimale pour pouvoir exploser
const NOVA_PER_SHARD = 12;    // points par éclat détruit (× taille de l'orbe)

// ---------- Canvas ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (mode === 'arcade' && state === 'playing'){
    player.y  = Math.min(H - 40, Math.max(H * 0.16, player.y  || H * 0.75));
    player.ty = Math.min(H - 40, Math.max(H * 0.16, player.ty || H * 0.75));
  } else {
    player.y = player.ty = H * 0.8;
  }
}
window.addEventListener('resize', resize);

// ---------- Éléments UI ----------
const ui = {
  hud:        document.getElementById('hud'),
  score:      document.getElementById('score'),
  combo:      document.getElementById('combo'),
  menu:       document.getElementById('menu'),
  playSurvie: document.getElementById('playSurvie'),
  playArcade: document.getElementById('playArcade'),
  bestSurvie: document.getElementById('bestSurvie'),
  bestArcade: document.getElementById('bestArcade'),
  toMenu:     document.getElementById('toMenu'),
  over:       document.getElementById('over'),
  finalScore: document.getElementById('finalScore'),
  newBest:    document.getElementById('newBest'),
  overBest:   document.getElementById('overBest'),
  replay:     document.getElementById('replay'),
  pause:      document.getElementById('pause'),
  mute:       document.getElementById('mute'),
  burst:      document.getElementById('burst'),
};

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- Persistance des records (un par mode) ----------
// window.storage (artifact Claude) → localStorage (GitHub Pages) → mémoire
let best = { survie: 0, arcade: 0 };
async function loadKey(key){
  try{
    if (window.storage){
      const r = await window.storage.get(key);
      if (r && r.value) return parseInt(r.value, 10) || 0;
    }
  }catch(e){}
  try{
    if (typeof localStorage !== 'undefined'){
      const v = localStorage.getItem(key);
      if (v) return parseInt(v, 10) || 0;
    }
  }catch(e){}
  return 0;
}
async function saveBest(){
  const key = 'lueur-best-' + mode, v = String(best[mode]);
  try{ if (window.storage){ await window.storage.set(key, v); return; } }catch(e){}
  try{ if (typeof localStorage !== 'undefined') localStorage.setItem(key, v); }catch(e){}
}
function refreshMenuBests(){
  ui.bestSurvie.textContent = best.survie > 0 ? 'Record · ' + best.survie : '';
  ui.bestArcade.textContent = best.arcade > 0 ? 'Record · ' + best.arcade : '';
}

// ---------- Audio (Web Audio, sons synthétisés) ----------
let audioCtx = null, master = null, muted = false;
const VOLUMES = [
  { label: '♪',  v: 1,    name: 'normal' },
  { label: '♪+', v: 1.7,  name: 'fort' },
  { label: '♪−', v: 0.45, name: 'bas' },
  { label: '∅',  v: 0,    name: 'coupé' },
];
let volLevel = 0;
function initAudio(){
  if (audioCtx || muted) return;
  try{
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    master = audioCtx.createGain();
    master.gain.value = VOLUMES[volLevel].v;
    master.connect(audioCtx.destination);
  }catch(e){}
}
function tone(freq, dur, type, vol, when){
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime + (when || 0);
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.05);
}
function playGraze(combo){
  const f = 620 + Math.min(combo, 10) * 55;
  tone(f, 0.16, 'sine', 0.16);
  tone(f * 1.5, 0.22, 'sine', 0.07, 0.04);
}
function playStart(){ tone(440, 0.3, 'sine', 0.1); tone(660, 0.4, 'sine', 0.08, 0.1); }
function playDeath(){
  tone(160, 0.5, 'triangle', 0.22);
  tone(82, 0.7, 'sine', 0.2, 0.05);
}
function playNova(){
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const sr = audioCtx.sampleRate;

  // bus avec saturation + compression : c'est de là que vient le "punch"
  const comp = audioCtx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 6;
  comp.ratio.value = 14; comp.attack.value = 0.002; comp.release.value = 0.25;
  comp.connect(master);

  const shaper = audioCtx.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++){
    curve[i] = Math.tanh(((i / 511.5) - 1) * 3.2);
  }
  shaper.curve = curve;
  shaper.connect(comp);

  // 1. la déflagration : bruit blanc dense, filtre qui s'effondre
  const dur = 1.4;
  const buf = audioCtx.createBuffer(1, Math.floor(sr * dur), sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++){
    d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.6);
  }
  const blast = audioCtx.createBufferSource();
  blast.buffer = buf;
  const bf = audioCtx.createBiquadFilter();
  bf.type = 'lowpass';
  bf.frequency.setValueAtTime(2000, t);
  bf.frequency.exponentialRampToValueAtTime(42, t + dur);
  const bg = audioCtx.createGain();
  bg.gain.setValueAtTime(0.95, t);
  bg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  blast.connect(bf); bf.connect(bg); bg.connect(shaper);
  blast.start(t);

  // 2. le coup dans le ventre : sub qui plonge de 120 à 24 Hz
  const sub = audioCtx.createOscillator();
  const sg = audioCtx.createGain();
  sub.type = 'sine';
  sub.frequency.setValueAtTime(120, t);
  sub.frequency.exponentialRampToValueAtTime(24, t + 0.8);
  sg.gain.setValueAtTime(1.15, t);
  sg.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  sub.connect(sg); sg.connect(shaper);
  sub.start(t); sub.stop(t + 1.2);

  // 2b. corps médium-grave qui épaissit le son
  const body = audioCtx.createOscillator();
  const bog = audioCtx.createGain();
  body.type = 'triangle';
  body.frequency.setValueAtTime(90, t);
  body.frequency.exponentialRampToValueAtTime(34, t + 0.6);
  bog.gain.setValueAtTime(0.5, t);
  bog.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
  body.connect(bog); bog.connect(shaper);
  body.start(t); body.stop(t + 0.9);

  // 3. débris : crépitement granulaire en traîne
  const dDur = 1.1;
  const dBuf = audioCtx.createBuffer(1, Math.floor(sr * dDur), sr);
  const dd = dBuf.getChannelData(0);
  for (let i = 0; i < dd.length; i++){
    const spike = Math.random() < 0.015 ? 1 : 0.12;
    dd[i] = (Math.random() * 2 - 1) * spike * (1 - i / dd.length);
  }
  const deb = audioCtx.createBufferSource();
  deb.buffer = dBuf;
  const df = audioCtx.createBiquadFilter();
  df.type = 'bandpass';
  df.frequency.value = 1000; df.Q.value = 0.8;
  const dg = audioCtx.createGain();
  dg.gain.setValueAtTime(0.2, t + 0.1);
  dg.gain.exponentialRampToValueAtTime(0.0001, t + 0.1 + dDur);
  deb.connect(df); df.connect(dg); dg.connect(comp);
  deb.start(t + 0.1);
}
function playFizzle(){
  tone(220, 0.18, 'sine', 0.08);
  tone(150, 0.2, 'sine', 0.06, 0.06);
}
function playRecord(){
  tone(659, 0.14, 'sine', 0.12);
  tone(784, 0.16, 'sine', 0.11, 0.09);
  tone(988, 0.3, 'sine', 0.1, 0.18);
}
// vibrations haptiques (mobile)
function buzz(p){
  try{ if (navigator.vibrate) navigator.vibrate(p); }catch(e){}
}

// ---------- Ambiance ----------
let ambTick = 0, heartTimer = 0;

// ---------- Cœur de la lueur ----------
// double battement grave dont le tempo suit la vitesse du jeu
function heartThump(t, vol){
  // corps grave (ressenti aux écouteurs)
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(95, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.12);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + 0.22);
  // "toc" médium : la partie audible sur haut-parleur de téléphone
  const k = audioCtx.createOscillator();
  const kg = audioCtx.createGain();
  k.type = 'triangle';
  k.frequency.setValueAtTime(220, t);
  k.frequency.exponentialRampToValueAtTime(90, t + 0.06);
  kg.gain.setValueAtTime(0.0001, t);
  kg.gain.exponentialRampToValueAtTime(vol * 0.8, t + 0.008);
  kg.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  k.connect(kg); kg.connect(master);
  k.start(t); k.stop(t + 0.12);
}
function playHeart(){
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  heartThump(t, 0.34);          // boum
  heartThump(t + 0.14, 0.22);   // boum, plus faible
}

// ---------- Bourdonnement de charge ----------
// deux oscillateurs légèrement désaccordés : plus l'orbe est grosse,
// plus le hum monte en hauteur, en volume et en instabilité
let hum = null;
function startHum(){
  if (!audioCtx || muted || hum) return;
  const o1 = audioCtx.createOscillator();
  const o2 = audioCtx.createOscillator();
  o1.type = 'triangle'; o2.type = 'triangle';
  o1.frequency.value = 110; o2.frequency.value = 111.4;
  const f = audioCtx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.value = 700;
  const g = audioCtx.createGain();
  g.gain.value = 0.0001;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(master);
  o1.start(); o2.start();
  hum = { o1, o2, g };
}
function stopHum(){
  if (!hum || !audioCtx) return;
  const h = hum; hum = null;
  try{
    const t = audioCtx.currentTime;
    h.g.gain.cancelScheduledValues(t);
    h.g.gain.setTargetAtTime(0.0001, t, 0.12);
    h.o1.stop(t + 0.8); h.o2.stop(t + 0.8);
  }catch(e){}
}
ui.mute.addEventListener('click', (e) => {
  e.stopPropagation();
  volLevel = (volLevel + 1) % VOLUMES.length;
  const v = VOLUMES[volLevel];
  muted = v.v === 0;
  ui.mute.textContent = v.label;
  ui.mute.setAttribute('aria-label', 'Volume : ' + v.name);
  if (!muted) initAudio();
  if (master) master.gain.setTargetAtTime(Math.max(v.v, 0.0001), audioCtx.currentTime, 0.05);
  if (muted) stopHum();
  else if (state === 'playing') startHum();
});

// ---------- État du jeu ----------
let state = 'menu';            // menu | playing | dying | over | paused
let mode = 'survie';           // survie (esquive) | arcade (briser les rochers)
let score = 0, displayedScore = -1;
let combo = 0, comboTimer = 0;
let elapsed = 0;               // temps de jeu (s)
let grazeCount = 0;            // frôlements totaux — chaque frôlement accélère le jeu
let spawnTimer = 0;
let shake = 0;
let dyingTimer = 0;
let novaReadyShown = false;
let recordBeaten = false;
let safeX = 0, safeDir = 1;      // couloir sûr : garantie qu'un passage existe toujours
let fuse = 0, zapTimer = 0;      // surcharge : compte à rebours avant détonation
let trail = [];

const player = { x: 0, y: 0, tx: 0, ty: 0, r: 13, size: 1, reb: 1, pulse: 0, grazeGlow: 0 };
let obstacles = [], particles = [], rings = [], texts = [], stars = [];
let flames = [];
let flash = 0;
const keys = {};

// ---------- Étoiles de fond ----------
function makeStars(){
  stars = [];
  const n = Math.floor((W * H) / 12000);
  for (let i = 0; i < n; i++){
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      s: 0.4 + Math.random() * 1.4,        // taille
      p: 0.25 + Math.random() * 0.75,      // parallaxe
      tw: Math.random() * Math.PI * 2,     // phase de scintillement
    });
  }
}

// ---------- Vitesse globale ----------
// Départ lent. Monte doucement avec le temps, et surtout avec les frôlements :
// plus tu joues avec le feu, plus le feu se rapproche.
function speedFactor(){
  if (mode === 'arcade')
    return 1 + Math.min(elapsed * 0.009, 0.7) + Math.min(grazeCount * 0.02, 0.9);
  return 1 + Math.min(elapsed * 0.011, 0.9) + Math.min(grazeCount * 0.028, 1.1);
}

// ---------- Obstacles : éclats d'obscurité ----------
function spawnObstacle(){
  const size = 15 + Math.random() * 30;
  // braise rouge (arcade) : LE danger — probabilité qui monte avec le temps
  const burning = mode === 'arcade' && elapsed > 8 && Math.random() < Math.min(0.05 + elapsed * 0.0012, 0.18);
  // 35 % des éclats visent la zone du joueur (jamais les braises : équité)
  const aimed = !burning && Math.random() < 0.35;
  let x = aimed
    ? Math.min(W - size, Math.max(size, player.x + (Math.random() - 0.5) * 160))
    : size + Math.random() * (W - size * 2);

  // équité : jamais d'éclat dans le couloir sûr — un passage existe toujours
  const keep = size + 64;
  if (Math.abs(x - safeX) < keep){
    x = safeX + (x >= safeX ? 1 : -1) * keep;
    if (x < size || x > W - size){
      x = safeX - (x >= safeX ? 1 : -1) * keep;
    }
    x = Math.min(W - size, Math.max(size, x));
  }

  const speed = 150 * speedFactor() * (0.85 + Math.random() * 0.4);

  // trois familles de rochers — formes variées, jamais de triangles
  const fam = Math.random();
  let nvMin, nvMax, rMin, elong, fill, stroke;
  if (fam < 0.4){            // roc massif : rond, lourd
    nvMin = 7; nvMax = 9; rMin = 0.7; elong = 1;
    fill = '#0A1322'; stroke = 'rgba(150,182,222,0.65)';
  } else if (fam < 0.75){    // roc brisé : facettes irrégulières
    nvMin = 5; nvMax = 6; rMin = 0.55; elong = 1.15;
    fill = '#070F1B'; stroke = 'rgba(178,198,232,0.7)';
  } else {                   // roc allongé : oblong, teinte violacée
    nvMin = 6; nvMax = 7; rMin = 0.65; elong = 1.4;
    fill = '#0D1830'; stroke = 'rgba(168,158,224,0.6)';
  }
  if (burning){
    fill = '#3A0E08'; stroke = 'rgba(255,120,60,0.95)';
  }
  const verts = [];
  const nv = nvMin + Math.floor(Math.random() * (nvMax - nvMin + 1));
  for (let i = 0; i < nv; i++){
    const a = (i / nv) * Math.PI * 2;
    const r = size * (rMin + Math.random() * (1 - rMin));
    verts.push({ x: Math.cos(a) * r, y: Math.sin(a) * r * elong });
  }

  obstacles.push({
    x, y: -size * 2,
    vx: (Math.random() - 0.5) * 50,
    vy: speed,
    r: size,
    verts,
    fill, stroke,
    rot: Math.random() * Math.PI * 2,
    vr: (Math.random() - 0.5) * 1.6,
    grazed: false,
    burning,
    flick: Math.random() * 6,
  });
}

// ---------- Nova : l'explosion de la lueur ----------
// L'orbe grossit à chaque frôlement. Le joueur choisit QUAND la faire
// exploser (2e doigt sur l'écran, ou Espace) : tous les éclats sont détruits,
// gain = éclats × 12 × taille de l'orbe. Puis la lueur redevient petite.
// Plus tu attends, plus tu gagnes — et plus tu es grosse, donc vulnérable.
function tryBurst(){
  if (state !== 'playing') return;
  if (player.size < MIN_BURST){
    addText(player.x, player.y - 44, 'pas encore…');
    playFizzle();
    return;
  }
  const count = obstacles.length;
  const gain = Math.round(count * NOVA_PER_SHARD * player.size);
  score += gain;
  for (const o of obstacles){
    burst(o.x, o.y, reducedMotion ? 3 : 8, 170);
    addRing(o.x, o.y);
  }
  obstacles = [];
  // la lueur explose elle aussi…
  burst(player.x, player.y, reducedMotion ? 15 : 45, 300);
  addRing(player.x, player.y);
  addText(player.x, player.y - 64, 'NOVA  +' + gain, true);
  flash = 0.5;
  if (!reducedMotion) shake = 8;
  player.size = 1;
  player.reb = 0;            // …puis se reconstitue
  player.grazeGlow = 1;
  fuse = 0;
  playNova();
  buzz(70);
}

// détonation de surcharge : la lueur pète toute seule — gain réduit de moitié
function autoBurst(){
  const count = obstacles.length;
  const gain = Math.round(count * NOVA_PER_SHARD * player.size * 0.5);
  score += gain;
  for (const o of obstacles){
    burst(o.x, o.y, reducedMotion ? 3 : 8, 170);
    addRing(o.x, o.y);
  }
  obstacles = [];
  burst(player.x, player.y, reducedMotion ? 20 : 60, 340);
  addRing(player.x, player.y);
  addText(player.x, player.y - 64, 'SURCHARGE  +' + gain, true);
  flash = 0.6;
  if (!reducedMotion) shake = 12;
  player.size = 1;
  player.reb = 0;
  fuse = 0;
  playNova();
  buzz(110);
}
function playZap(){
  tone(1400 + Math.random() * 1200, 0.04, 'square', 0.05);
}

// ---------- Effets ----------
function burst(x, y, n, spd){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const v = spd * (0.25 + Math.random() * 0.9);
    particles.push({
      x, y,
      vx: Math.cos(a) * v,
      vy: Math.sin(a) * v - 40,
      r: 1 + Math.random() * 2.6,
      life: 1,
      decay: 0.9 + Math.random() * 1.1,
    });
  }
}
function addRing(x, y){ rings.push({ x, y, r: 16, life: 1 }); }
function addText(x, y, str, big){
  texts.push({ x: Math.min(W - 50, Math.max(50, x)), y, str, life: 1, big: !!big });
}

// ---------- Déroulement ----------
function startGame(m){
  if (m) mode = m;
  obstacles = []; particles = []; rings = []; texts = []; flames = [];
  flash = 0;
  score = 0; displayedScore = -1; combo = 0; comboTimer = 0;
  elapsed = 0; spawnTimer = 0.6; shake = 0; grazeCount = 0;
  player.x = player.tx = W / 2;
  if (mode === 'arcade'){ player.y = player.ty = H * 0.75; }
  else { player.y = player.ty = H * 0.8; }
  player.size = 1;
  player.reb = 1;
  novaReadyShown = false;
  recordBeaten = false;
  ui.score.classList.remove('record');
  safeX = W / 2;
  safeDir = Math.random() < 0.5 ? -1 : 1;
  trail.length = 0;
  fuse = 0; zapTimer = 0;
  player.grazeGlow = 0;
  state = 'playing';
  ui.menu.classList.add('hidden');
  ui.over.classList.add('hidden');
  ui.hud.classList.add('visible');
  initAudio(); playStart();
  startHum();
  heartTimer = 0.6;
}

function die(){
  state = 'dying';
  dyingTimer = 0;
  combo = 0;
  burst(player.x, player.y, reducedMotion ? 20 : 55, 320);
  addRing(player.x, player.y);
  if (!reducedMotion) shake = 14;
  stopHum();
  playDeath();
  buzz(180);
  trail.length = 0;
  ui.hud.classList.remove('visible');
}

async function endGame(){
  state = 'over';
  const final = Math.floor(score);
  ui.finalScore.textContent = final;
  if (final > best[mode]){
    best[mode] = final;
    ui.newBest.classList.add('show');
    ui.overBest.textContent = 'Record · ' + best[mode];
    await saveBest();
  } else {
    ui.newBest.classList.remove('show');
    const diff = best[mode] - final;
    ui.overBest.textContent = (best[mode] > 0 && diff > 0)
      ? 'Record · ' + best[mode] + '  ·  à ' + diff + ' points'
      : 'Record · ' + best[mode];
  }
  ui.over.classList.remove('hidden');
}

// ---------- Entrées ----------
let dragging = false, lastPX = 0, lastPY = 0;
function dragMove(e){
  if (state !== 'playing' || !dragging) return;
  // contrôle relatif : l'orbe suit le MOUVEMENT du doigt maintenu, pas sa position
  player.tx += e.clientX - lastPX;
  if (mode === 'arcade') player.ty += e.clientY - lastPY;
  lastPX = e.clientX; lastPY = e.clientY;
}
const activePointers = new Set();
let primaryId = null, lastTap = 0;

window.addEventListener('pointermove', (e) => {
  // seul le premier doigt pilote l'orbe
  if (e.pointerType === 'touch' && primaryId !== null && e.pointerId !== primaryId) return;
  dragMove(e);
});
window.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button')) return;
  initAudio();
  if (state === 'menu'){
    // le choix du mode se fait par les boutons
  } else if (state === 'paused'){
    ui.pause.classList.add('hidden');
    state = 'playing';
    startHum();
  } else if (state === 'playing'){
    if (primaryId === null || e.pointerId === primaryId){
      // double appui rapide : déclenche la nova
      const now = performance.now();
      if (now - lastTap < 300) tryBurst();
      lastTap = now;
      primaryId = e.pointerId;
      dragging = true;
      lastPX = e.clientX; lastPY = e.clientY;
    } else {
      // deuxième doigt pendant la glisse : déclenche aussi la nova
      tryBurst();
    }
  }
  activePointers.add(e.pointerId);
  if (primaryId === null) primaryId = e.pointerId;
});
function releasePointer(e){
  activePointers.delete(e.pointerId);
  if (e.pointerId === primaryId){ primaryId = null; dragging = false; }
}
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);
ui.replay.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });
ui.playSurvie.addEventListener('click', (e) => { e.stopPropagation(); initAudio(); startGame('survie'); });
ui.playArcade.addEventListener('click', (e) => { e.stopPropagation(); initAudio(); startGame('arcade'); });
ui.toMenu.addEventListener('click', (e) => {
  e.stopPropagation();
  ui.over.classList.add('hidden');
  ui.menu.classList.remove('hidden');
  refreshMenuBests();
  state = 'menu';
});
ui.burst.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  e.stopPropagation();
  tryBurst();
});

window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'Enter') && (state === 'menu' || state === 'over')){
    initAudio(); startGame();
  } else if (e.key === ' ' && state === 'playing'){
    tryBurst();
  } else if (state === 'paused'){
    ui.pause.classList.add('hidden');
    state = 'playing';
    startHum();
  }
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// pause automatique : appel, notification, changement d'app, écran éteint
document.addEventListener('visibilitychange', () => {
  if (document.hidden && state === 'playing'){
    state = 'paused';
    ui.pause.classList.remove('hidden');
    stopHum();
  }
});

// ---------- Mise à jour ----------
function update(dt){
  // étoiles : dérive lente vers le bas
  const starSpeed = state === 'playing' ? 14 * speedFactor() : 10;
  for (const s of stars){
    s.y += starSpeed * s.p * dt;
    s.tw += dt * 2;
    if (s.y > H + 4){ s.y = -4; s.x = Math.random() * W; }
  }

  if (state === 'playing'){
    elapsed += dt;

    // le couloir sûr dérive lentement — garantie d'équité invisible
    safeX += safeDir * (34 + 26 * (speedFactor() - 1)) * dt;
    if (safeX < W * 0.12){ safeX = W * 0.12; safeDir = 1; }
    if (safeX > W * 0.88){ safeX = W * 0.88; safeDir = -1; }
    if (Math.random() < dt * 0.12) safeDir *= -1;

    // record battu en direct
    if (!recordBeaten && best[mode] > 0 && score > best[mode]){
      recordBeaten = true;
      addText(player.x, player.y - 72, 'RECORD !', true);
      flash = Math.max(flash, 0.3);
      ui.score.classList.add('record');
      playRecord();
      buzz(40);
    }

    // ambiance : la charge sonore suit la taille de l'orbe
    ambTick += dt;
    if (audioCtx && ambTick > 0.5){
      ambTick = 0;
      if (hum){
        const c = (player.size - 1) / (SIZE_MAX - 1);
        hum.g.gain.setTargetAtTime(0.13 * c, audioCtx.currentTime, 0.3);
        const hf = 110 + c * 120;
        hum.o1.frequency.setTargetAtTime(hf, audioCtx.currentTime, 0.3);
        hum.o2.frequency.setTargetAtTime(hf * 1.013, audioCtx.currentTime, 0.3);
      }
    }
    // le cœur bat au tempo du danger
    heartTimer -= dt;
    if (heartTimer <= 0){
      playHeart();
      heartTimer = Math.max(0.42, 1.15 / speedFactor());
    }

    // surcharge : la lueur crépite puis détone toute seule
    if (fuse > 0){
      fuse -= dt;
      zapTimer -= dt;
      if (zapTimer <= 0){
        playZap();
        zapTimer = 0.08 + Math.random() * 0.22;
      }
      if (fuse <= 0) autoBurst();
    }

    // clavier
    if (keys['ArrowLeft'])  player.tx -= 460 * dt;
    if (keys['ArrowRight']) player.tx += 460 * dt;
    if (mode === 'arcade'){
      if (keys['ArrowUp'])   player.ty -= 460 * dt;
      if (keys['ArrowDown']) player.ty += 460 * dt;
      player.ty = Math.min(H - 40, Math.max(H * 0.16, player.ty));
    }
    player.tx = Math.min(W - player.r, Math.max(player.r, player.tx));

    // déplacement fluide de l'orbe
    player.x += (player.tx - player.x) * Math.min(1, dt * 16);
    if (mode === 'arcade') player.y += (player.ty - player.y) * Math.min(1, dt * 16);
    player.pulse += dt * 3;
    player.grazeGlow = Math.max(0, player.grazeGlow - dt * 2.2);
    player.reb = Math.min(1, player.reb + dt * 1.6);

    // traînée
    trail.push({ x: player.x, y: player.y });
    if (trail.length > 16) trail.shift();

    // combo
    if (comboTimer > 0){
      comboTimer -= dt;
      if (comboTimer <= 0) combo = 0;
    }

    // apparition des éclats
    spawnTimer -= dt;
    if (spawnTimer <= 0){
      spawnObstacle();
      const interval = mode === 'arcade'
        ? Math.max(0.28, 0.95 - elapsed * 0.005 - grazeCount * 0.007)
        : Math.max(0.24, 0.95 - elapsed * 0.006 - grazeCount * 0.01);
      spawnTimer = interval * (0.7 + Math.random() * 0.6);
    }

    // obstacles : mouvement, frôlement, collision
    for (let i = obstacles.length - 1; i >= 0; i--){
      const o = obstacles[i];
      o.x += o.vx * dt;
      o.y += o.vy * dt;
      o.rot += o.vr * dt;
      if (o.burning){
        o.flick += dt * 7;
        // émission continue de flammes : le feu monte pendant que le roc tombe → météore
        if (!reducedMotion){
          const n = Math.ceil(dt * 55);
          for (let k = 0; k < n; k++){
            const a = Math.random() * Math.PI * 2;
            const rr = o.r * (0.5 + Math.random() * 0.5);
            flames.push({
              x: o.x + Math.cos(a) * rr,
              y: o.y + Math.sin(a) * rr * 0.6,
              vx: o.vx * 0.4 + (Math.random() - 0.5) * 50,
              vy: -40 - Math.random() * 90,
              r: (2.2 + Math.random() * 3) * (o.r / 22),
              life: 1,
              decay: 1.5 + Math.random() * 0.9,
            });
          }
        }
      }

      if (o.y > H + o.r * 2){
        // rocher esquivé : petits points, multipliés par la taille de l'orbe
        score += Math.round(PASS_POINTS * player.size);
        obstacles.splice(i, 1);
        continue;
      }

      const pr = player.r * player.size * Math.max(0.05, player.reb);
      const dx = o.x - player.x, dy = o.y - player.y;
      const dist = Math.hypot(dx, dy);

      if (mode === 'arcade'){
        // braise rouge : ses flammes brûlent — zone mortelle PLUS LARGE que la zone de casse
        if (o.burning && dist < pr + o.r * 1.05){
          die();
          return;
        }
        // BOUM : toucher un rocher normal le brise — c'est le but du jeu !
        if (!o.burning && dist < pr + o.r * 0.85){
          combo++;
          grazeCount++;
          player.size = Math.min(SIZE_MAX, player.size + SIZE_PER_GRAZE);
          if (player.size >= SIZE_CRITICAL && fuse <= 0){
            fuse = 2.5 + Math.random() * 2;
            addText(player.x, player.y - 52, 'surcharge !', true);
          }
          comboTimer = COMBO_WINDOW;
          const bonus = Math.round(10 * player.size) + GRAZE_BONUS * Math.min(combo, 6);
          score += bonus;
          player.grazeGlow = 1;
          addRing(o.x, o.y);
          addText(o.x, o.y, '+' + bonus, player.size >= 1.8);
          if (!novaReadyShown && player.size >= MIN_BURST){
            novaReadyShown = true;
            addText(player.x, player.y - 52, 'nova prête !', true);
          }
          burst(o.x, o.y, reducedMotion ? 4 : 10, 190);
          playGraze(combo);
          buzz(15);
          obstacles.splice(i, 1);
          continue;
        }
      } else {
        // collision (légèrement indulgente : ça paraît juste)
        if (dist < pr + o.r * 0.78){
          die();
          return;
        }
        // frôlement
        if (!o.grazed && dist < pr + o.r + GRAZE_MARGIN){
          o.grazed = true;
          combo++;
          grazeCount++;
          player.size = Math.min(SIZE_MAX, player.size + SIZE_PER_GRAZE);
          if (player.size >= SIZE_CRITICAL && fuse <= 0){
            fuse = 2.5 + Math.random() * 2;     // la détonation approche…
            addText(player.x, player.y - 52, 'surcharge !', true);
          }
          comboTimer = COMBO_WINDOW;
          const sizeBonus = Math.round((player.size - 1) * 125);  // jusqu'à +250 en pleine surcharge
          const bonus = GRAZE_BONUS * combo + sizeBonus;
          score += bonus;
          player.grazeGlow = 1;
          addRing(player.x, player.y);
          addText(o.x, o.y, '+' + bonus, sizeBonus >= 60);
          if (!novaReadyShown && player.size >= MIN_BURST){
            novaReadyShown = true;
            addText(player.x, player.y - 52, 'nova prête !', true);
          }
          if (!reducedMotion) burst((o.x + player.x) / 2, (o.y + player.y) / 2, 6, 120);
          playGraze(combo);
          buzz(12);
        }
      }
    }
  }

  if (state === 'dying'){
    dyingTimer += dt;
    // les éclats poursuivent leur chute
    for (const o of obstacles){ o.y += o.vy * dt; o.rot += o.vr * dt; }
    if (dyingTimer > 1.1) endGame();
  }

  // particules
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += 160 * dt;
    p.life -= p.decay * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // flammes : montée (le feu monte toujours), vacillement, extinction
  for (let i = flames.length - 1; i >= 0; i--){
    const f = flames[i];
    f.vy -= 70 * dt;
    f.vx += (Math.random() - 0.5) * 140 * dt;
    f.x += f.vx * dt; f.y += f.vy * dt;
    f.life -= f.decay * dt;
    if (f.life <= 0) flames.splice(i, 1);
  }
  // anneaux
  for (let i = rings.length - 1; i >= 0; i--){
    const r = rings[i];
    r.r += 240 * dt; r.life -= 1.8 * dt;
    if (r.life <= 0) rings.splice(i, 1);
  }
  // textes flottants
  for (let i = texts.length - 1; i >= 0; i--){
    const t = texts[i];
    t.y -= 46 * dt; t.life -= 0.85 * dt;
    if (t.life <= 0) texts.splice(i, 1);
  }

  shake = Math.max(0, shake - dt * 26);
  flash = Math.max(0, flash - dt * 1.5);

  // HUD
  const s = Math.floor(score);
  if (s !== displayedScore){ displayedScore = s; ui.score.textContent = s; }
  if (combo >= 2 && state === 'playing'){
    ui.combo.textContent = '×' + combo + (mode === 'arcade' ? ' brisés' : ' frôlés');
    ui.combo.classList.add('on');
  } else {
    ui.combo.classList.remove('on');
  }
  ui.burst.classList.toggle('ready', state === 'playing' && player.size >= MIN_BURST);
}

// ---------- Rendu ----------
function draw(){
  // fond : dégradé nocturne
  const bg = ctx.createRadialGradient(W / 2, H * 0.38, 0, W / 2, H * 0.38, Math.max(W, H) * 0.85);
  bg.addColorStop(0, '#24395A');
  bg.addColorStop(1, '#122440');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  // étoiles
  for (const s of stars){
    const a = 0.3 + 0.45 * s.p + Math.sin(s.tw) * 0.12;
    ctx.fillStyle = 'rgba(220,228,240,' + a.toFixed(3) + ')';
    ctx.fillRect(s.x, s.y, s.s, s.s);
  }

  // éclats d'obscurité
  for (const o of obstacles){
    ctx.save();
    ctx.translate(o.x, o.y);
    if (o.burning){
      const fg = ctx.createRadialGradient(0, 0, 0, 0, 0, o.r * 1.8);
      fg.addColorStop(0, 'rgba(255,110,40,' + (0.35 + Math.sin(o.flick) * 0.12).toFixed(2) + ')');
      fg.addColorStop(1, 'rgba(255,60,20,0)');
      ctx.fillStyle = fg;
      ctx.beginPath(); ctx.arc(0, 0, o.r * 1.8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.rotate(o.rot);
    ctx.beginPath();
    ctx.moveTo(o.verts[0].x, o.verts[0].y);
    for (let i = 1; i < o.verts.length; i++) ctx.lineTo(o.verts[i].x, o.verts[i].y);
    ctx.closePath();
    ctx.fillStyle = o.fill;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = o.grazed ? 'rgba(201,168,76,0.85)' : o.stroke;
    ctx.stroke();
    ctx.restore();
  }

  // flammes des braises : rendu additif — la lumière s'accumule comme un vrai feu
  if (flames.length){
    ctx.globalCompositeOperation = 'lighter';
    for (const f of flames){
      const l = Math.max(0, f.life);
      let col;
      if (l > 0.66)      col = '255,236,170';
      else if (l > 0.33) col = '255,140,45';
      else               col = '185,55,18';
      ctx.fillStyle = 'rgba(' + col + ',' + (l * 0.45).toFixed(2) + ')';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r * (0.5 + l * 0.9), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  // anneaux dorés (frôlements)
  for (const r of rings){
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,168,76,' + (r.life * 0.6).toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  // traînée de la lueur
  if (state === 'playing'){
    for (let i = 0; i < trail.length; i++){
      const tr = trail[i];
      const f = (i + 1) / trail.length;
      ctx.fillStyle = 'rgba(201,168,76,' + (f * 0.2).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(tr.x, tr.y, player.r * player.size * 0.5 * f, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // l'orbe (pas pendant/après la mort)
  if (state === 'playing' || state === 'menu' || state === 'paused'){
    let px = state === 'menu' ? W / 2 : player.x;
    let py = state === 'menu' ? H * 0.66 : player.y;
    if (state === 'playing' && fuse > 0 && fuse < 1.2 && !reducedMotion){
      px += (Math.random() - 0.5) * 5;     // tremblement avant détonation
      py += (Math.random() - 0.5) * 5;
    }
    const e = state === 'menu' ? 1 : (1 - Math.pow(1 - player.reb, 3));   // reconstitution
    const sz = (state === 'menu' ? 1 : player.size) * Math.max(0.04, e);
    const pr = player.r * sz;
    const breath = 1 + Math.sin(player.pulse) * 0.06;
    const glowR = (38 + player.grazeGlow * 30) * sz * breath;

    // halo
    const halo = ctx.createRadialGradient(px, py, 0, px, py, glowR);
    halo.addColorStop(0, 'rgba(232,213,163,' + (0.65 + player.grazeGlow * 0.3) + ')');
    halo.addColorStop(0.45, 'rgba(201,168,76,0.22)');
    halo.addColorStop(1, 'rgba(201,168,76,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(px, py, glowR, 0, Math.PI * 2); ctx.fill();

    // cœur
    const core = ctx.createRadialGradient(px - 3, py - 4, 1, px, py, pr);
    core.addColorStop(0, '#FFF7E2');
    core.addColorStop(0.55, GOLD_LIGHT);
    core.addColorStop(1, GOLD);
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(px, py, pr * breath, 0, Math.PI * 2); ctx.fill();

    // anneau "nova prête" : pulse autour de l'orbe dès le seuil atteint
    if (state === 'playing' && player.size >= MIN_BURST){
      ctx.beginPath();
      ctx.arc(px, py, pr + 9 + Math.sin(player.pulse * 2) * 2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(201,168,76,' + (0.32 + Math.sin(player.pulse * 2) * 0.15).toFixed(3) + ')';
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }

    // éclairs de surcharge
    if (state === 'playing' && player.size >= SIZE_CRITICAL){
      const danger = fuse > 0 ? Math.min(1, 1 - fuse / 4.5) : 0.4;
      const nArcs = 2 + Math.floor(danger * 3);
      ctx.lineWidth = 1.2;
      for (let a = 0; a < nArcs; a++){
        const ang = Math.random() * Math.PI * 2;
        let ax = px + Math.cos(ang) * pr;
        let ay = py + Math.sin(ang) * pr;
        ctx.beginPath();
        ctx.moveTo(ax, ay);
        const segs = 3 + Math.floor(Math.random() * 3);
        const reach = pr * (0.8 + danger * 0.9);
        for (let s2 = 0; s2 < segs; s2++){
          ax += Math.cos(ang) * (reach / segs) + (Math.random() - 0.5) * 14;
          ay += Math.sin(ang) * (reach / segs) + (Math.random() - 0.5) * 14;
          ctx.lineTo(ax, ay);
        }
        ctx.strokeStyle = 'rgba(255,241,204,' + (0.35 + Math.random() * 0.45).toFixed(2) + ')';
        ctx.stroke();
      }
    }
  }

  // particules dorées
  for (const p of particles){
    ctx.fillStyle = 'rgba(232,213,163,' + Math.max(0, p.life).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }

  // textes flottants
  ctx.textAlign = 'center';
  for (const t of texts){
    ctx.font = t.big
      ? "600 27px 'Cormorant Garamond', Georgia, serif"
      : "500 19px 'Cormorant Garamond', Georgia, serif";
    ctx.fillStyle = t.big
      ? 'rgba(255,241,204,' + Math.max(0, t.life).toFixed(3) + ')'
      : 'rgba(232,213,163,' + Math.max(0, t.life).toFixed(3) + ')';
    ctx.fillText(t.str, t.x, t.y);
  }

  ctx.restore();

  // flash de la Nova
  if (flash > 0){
    ctx.fillStyle = 'rgba(243,228,190,' + (flash * 0.35).toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

// ---------- Boucle ----------
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- Lancement ----------
(async function init(){
  resize();
  makeStars();
  player.x = player.tx = W / 2;
  best.survie = (await loadKey('lueur-best-survie')) || (await loadKey('lueur-best'));
  best.arcade = await loadKey('lueur-best-arcade');
  refreshMenuBests();
  requestAnimationFrame(loop);
})();
window.addEventListener('resize', makeStars);

// PWA : service worker pour le mode hors-ligne (ignoré hors déploiement)
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
